<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThreeGeoPlay demo</title>
    <meta name="description" content="OpenStreetMap vector tiles rendered as Three.js geometry, in the browser." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f3efe6'/%3E%3Cpath d='M16 5.5c-4.1 0-7.2 3.1-7.2 7.1 0 5.3 7.2 13.9 7.2 13.9s7.2-8.6 7.2-13.9c0-4-3.1-7.1-7.2-7.1z' fill='%23b4432f'/%3E%3Ccircle cx='16' cy='12.6' r='2.7' fill='%23f3efe6'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="viewport"></div>

    <nav id="modes" aria-label="Scenes">
      <button type="button" data-mode="explore" aria-pressed="true">Explore</button>
      <button type="button" data-mode="walk" aria-pressed="false">Walk</button>
      <button type="button" data-mode="fly" aria-pressed="false">Fly</button>
    </nav>

    <section id="hud" hidden>
      <h2 id="hud-title"></h2>
      <p id="hud-stats"></p>
      <ul id="hud-help"></ul>
    </section>
    <div id="hud-arrow" hidden aria-hidden="true">
      <svg viewBox="0 0 40 40" width="40" height="40"><path d="M20 3 L33 33 L20 26 L7 33 Z" fill="currentColor"/></svg>
    </div>
    <p id="hud-message" aria-live="polite"></p>

    <div id="readout" aria-live="polite">
      <div id="readout-position">—</div>
      <div id="readout-stats"></div>
      <div id="readout-pick"></div>
    </div>

    <p id="controls-hint">Drag to rotate · right-drag to pan · scroll to zoom · click to inspect</p>

    <aside id="panel" aria-label="Map settings">
      <header class="panel-head">
        <div>
          <h1>ThreeGeoPlay</h1>
          <p>OpenStreetMap vector tiles, drawn as Three.js geometry.</p>
          <p class="links">
            <a href="https://github.com/lorenzoMezza/Three-geo-play" target="_blank" rel="noopener">Source on GitHub</a>
            <span aria-hidden="true">·</span>
            <a href="https://www.npmjs.com/package/lm-three-geo-play" target="_blank" rel="noopener">npm</a>
          </p>
        </div>
        <button id="panel-close" type="button" aria-label="Hide settings" title="Hide settings">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3.5 3.5l9 9m0-9l-9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="panel-body" id="panel-body"></div>
      <footer class="panel-foot" id="panel-foot">Local · Rome &amp; Lazio · zoom 16</footer>
    </aside>
    <button id="panel-open" type="button" aria-controls="panel" hidden>Settings</button>

    <div class="attribution" id="attribution">
      <a href="https://openmaptiles.org/" target="_blank" rel="noopener">© OpenMapTiles</a>
      <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
